name: ChumpySwift
options:
  bundleIdPrefix: slop.miho
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

packages:
  ChumpyCore:
    path: Packages/ChumpyCore
  SwiftyXrayKit:
    path: Packages/SwiftyXrayKit

targets:
  Chumpy:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: ChumpyCore
      - package: SwiftyXrayKit
      - target: ChumpyTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: slop.miho.chumpy.swift
        GENERATE_INFOPLIST_FILE: NO
        # The alternate home screen icon rides the same rails the born
        # icon does — the rails Delta and Telegram both ride: the
        # AppIconInverted appiconset carries every slot the platform
        # knows (iphone and ipad both), and this flag tells actool to
        # include it beside the born AppIcon. A full set is the whole
        # trick: actool copies its faces to the bundle root under the
        # size-infixed names (AppIconInverted60x60@2x.png,
        # AppIconInverted76x76@2x~ipad.png) and writes the plist entry
        # with BOTH CFBundleIconFiles and CFBundleIconName — every iOS
        # and every icon cache resolves it, TrollStore's own parser
        # included. A single-size set, the first catalog attempt,
        # births neither the files nor the file names, only a bare
        # catalog name the iOS 16 icon cache refuses to resolve — the
        # blank grid the phone wore for two builds straight; and the
        # loose-file attempt without the catalog wore names the lookup
        # never tried and died the same death.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Chumpy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        BGTaskSchedulerPermittedIdentifiers:
          - slop.miho.chumpy.swift.subscription-refresh
    entitlements:
      path: App/Chumpy.entitlements
      properties:
        com.apple.security.application-groups:
          - group.slop.miho.chumpy.swift
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider

  ChumpyTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel/Sources
    dependencies:
      - package: ChumpyCore
      - package: SwiftyXrayKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: slop.miho.chumpy.swift.tunnel
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: ChumpyTunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Tunnel/ChumpyTunnel.entitlements
      properties:
        com.apple.security.application-groups:
          - group.slop.miho.chumpy.swift
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider

schemes:
  Chumpy:
    build:
      targets:
        Chumpy: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
  ChumpyTunnel:
    build:
      targets:
        ChumpyTunnel: all
    run:
      config: Debug
