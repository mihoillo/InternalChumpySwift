name: ChumpySwift
options:
  bundleIdPrefix: slop.miho
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7AGA8ZNZA4
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

packages:
  ChumpyCore:
    path: Packages/ChumpyCore
  SwiftyXrayKit:
    path: Packages/SwiftyXrayKit

targets:
  Chumpy:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: ChumpyCore
      - package: SwiftyXrayKit
      - target: ChumpyTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: slop.miho.chumpy.swift
        GENERATE_INFOPLIST_FILE: NO
        # The alternate home screen icon rides the same rails the born
        # icon does — and on this toolchain each rail is laid by its
        # own hand. This flag tells actool to include AppIconInverted
        # beside the born AppIcon: the set is named in Assets.car and
        # its CFBundleIconName lands in the plist entry. The set wears
        # the born icon's own shape — single-size, with its own dark
        # twin — because iOS 18 resolves an alternate's dark face the
        # one way it resolves the born icon's: through the catalog, by
        # appearance-tagged rendition. An alternate without a dark
        # variant is the shape the last builds shipped, and the phone
        # answered with the blank grid and a face that never went dark.
        # The dark twin itself is the glyph alone on a fully transparent
        # face — Apple's rule, verbatim: "Provide your dark app icon
        # with a transparent background so the system-provided
        # background can show through." An opaque dark rendition is a
        # face the phone refuses to wear: the system lays its own
        # night gradient under the glyph, and wants the glyph's
        # alpha to know where.
        # The file half of the double rail — the loose faces under the
        # size-infixed names (AppIconInverted60x60@2x.png,
        # AppIconInverted76x76@2x~ipad.png) and the CFBundleIconFiles
        # strings beside the catalog name — actool refuses to lay on
        # this toolchain, so CI lays it by hand (see ci.yml): files for
        # the iOS 16 icon cache that resolves by name, catalog for
        # every lookup since.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Chumpy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        BGTaskSchedulerPermittedIdentifiers:
          - slop.miho.chumpy.swift.subscription-refresh
        # Xray rides standard TLS only — exempt from export encryption
        # review. This key keeps the Organizer upload from asking.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/Chumpy.entitlements
      properties:
        com.apple.security.application-groups:
          - group.slop.miho.chumpy.swift
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider

  ChumpyTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel/Sources
    dependencies:
      - package: ChumpyCore
      - package: SwiftyXrayKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: slop.miho.chumpy.swift.tunnel
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: ChumpyTunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Tunnel/ChumpyTunnel.entitlements
      properties:
        com.apple.security.application-groups:
          - group.slop.miho.chumpy.swift
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider

schemes:
  Chumpy:
    build:
      targets:
        Chumpy: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
  ChumpyTunnel:
    build:
      targets:
        ChumpyTunnel: all
    run:
      config: Debug
