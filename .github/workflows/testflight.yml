name: TestFlight

# Manual upload of a signed Release build to App Store Connect.
# Prereqs (see docs/testflight.md):
#   - the app exists in App Store Connect under the nonprofit team
#     with bundle id slop.miho.chumpy.swift
#   - repo secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64,
#     ASC_TEAM_ID — an App Manager API key, so -allowProvisioningUpdates
#     can register App IDs, App Groups and profiles (cloud signing:
#     Xcode creates a managed distribution certificate when no .p12
#     secret is present)
#   - optional: DIST_CERT_P12_BASE64 + DIST_CERT_PASSWORD to pin a
#     specific distribution certificate instead of cloud signing
# The build number rides the workflow run number, so every upload is
# unique without touching project.yml; bump MARKETING_VERSION there
# for a new TestFlight version line.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Что тестим в этой сборке"
        required: false
        default: ""

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive & upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
      DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Decode App Store Connect API key
        run: printenv ASC_KEY_P8_BASE64 | base64 -d > AuthKey.p8

      # Cloud signing covers the no-.p12 case; when the secrets are set
      # the pinned certificate wins. If the archive step below fails
      # with "no signing certificate", this is the rail to lay: create
      # a distribution cert once and feed it here.
      - name: Import distribution certificate (optional)
        if: env.DIST_CERT_P12_BASE64 != ''
        run: |
          security create-keychain -p "" build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 build.keychain
          printenv DIST_CERT_P12_BASE64 | base64 -d > cert.p12
          security import cert.p12 -k build.keychain -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -k "" build.keychain
          security list-keychain -d user -s build.keychain login.keychain-db

      - name: Archive (Release, device)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ChumpySwift.xcodeproj \
            -scheme Chumpy \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Chumpy.xcarchive \
            -skipPackagePluginValidation \
            -currentProjectVersion "${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee archive.log | xcbeautify --renderer github-actions

      - name: Export & upload to App Store Connect
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$ASC_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Chumpy.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chumpy-testflight-ipa
          path: build/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 7
