name: CI

on:
  # The unsigned TrollStore IPA is paused for now — main pushes build
  # TestFlight only (see testflight.yml). CI still guards every other
  # branch, every PR, and answers a manual dispatch.
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Unit tests (ChumpyCore)
        run: swift test --package-path Packages/ChumpyCore

      - name: Build app for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ChumpySwift.xcodeproj \
            -scheme Chumpy \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | xcbeautify --renderer github-actions

      # An unsigned device build, packaged as an IPA: the user's own
      # signing (TrollStore / ldid / esign) finishes it on the device —
      # CI never sees a certificate.
      - name: Build unsigned IPA (iOS device)
        run: |
          set -o pipefail
          brew install ldid
          xcodebuild \
            -project ChumpySwift.xcodeproj \
            -scheme Chumpy \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath device-build \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee device-build.log | xcbeautify --renderer github-actions
          APP="device-build/Build/Products/Release-iphoneos/Chumpy.app"
          test -d "$APP" || { echo "no app product"; exit 1; }
          test -d "$APP/PlugIns/ChumpyTunnel.appex" || { echo "no tunnel extension embedded"; exit 1; }
          rm -rf Payload Chumpy-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          # The unsigned build carries no embedded entitlements (Xcode skips
          # them with signing off) — and without them TrollStore installs an
          # app the NetworkExtension framework answers with "permission
          # denied". ldid bakes them into both binaries as a fakesignature;
          # TrollStore preserves them when it re-signs on device.
          ldid -SSigning/app.entitlements Payload/Chumpy.app/Chumpy
          ldid -SSigning/tunnel.entitlements \
            Payload/Chumpy.app/PlugIns/ChumpyTunnel.appex/ChumpyTunnel
          echo "--- app entitlements ---"
          ldid -e Payload/Chumpy.app/Chumpy
          echo "--- tunnel entitlements ---"
          ldid -e Payload/Chumpy.app/PlugIns/ChumpyTunnel.appex/ChumpyTunnel
          # The alternate icon's file rail: actool writes the catalog
          # entry (CFBundleIconName) into the plist but stops short of
          # the file half on this toolchain — it neither copies the
          # loose faces to the bundle root nor writes the
          # CFBundleIconFiles strings pointing at them, and the iOS 16
          # icon cache resolves icons by file names first. The faces
          # ride in through the resources phase under the exact names
          # the shipped Delta bundle wears (X@2x 120px, X76x76~ipad
          # 152px); this step writes the strings, one PlistBuddy call
          # each, merging with what actool already put there — the
          # double-rail entry the only TrollStore-proven alternate
          # bundle carries: catalog name for the new lookups, file
          # names for every cache since the dawn.
          PLIST=Payload/Chumpy.app/Info.plist
          /usr/libexec/PlistBuddy -c "add :CFBundleIcons:CFBundleAlternateIcons:AppIconInverted:CFBundleIconFiles array" "$PLIST"
          /usr/libexec/PlistBuddy -c "add :CFBundleIcons:CFBundleAlternateIcons:AppIconInverted:CFBundleIconFiles:0 string AppIconInverted60x60" "$PLIST"
          /usr/libexec/PlistBuddy -c "add :CFBundleIcons:CFBundleAlternateIcons:AppIconInverted:CFBundleIconFiles:1 string AppIconInverted76x76" "$PLIST"
          /usr/libexec/PlistBuddy -c "add :CFBundleIcons~ipad:CFBundleAlternateIcons:AppIconInverted dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "add :CFBundleIcons~ipad:CFBundleAlternateIcons:AppIconInverted:CFBundleIconFiles array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "add :CFBundleIcons~ipad:CFBundleAlternateIcons:AppIconInverted:CFBundleIconFiles:0 string AppIconInverted76x76" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "add :CFBundleIcons~ipad:CFBundleAlternateIcons:AppIconInverted:CFBundleIconFiles:1 string AppIconInverted60x60" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "add :CFBundleIcons~ipad:CFBundleAlternateIcons:AppIconInverted:CFBundleIconName string AppIconInverted" "$PLIST" 2>/dev/null || true
          echo "--- alternate icon plist entry ---"
          /usr/libexec/PlistBuddy -c "print :CFBundleIcons:CFBundleAlternateIcons" "$PLIST"
          test -f Payload/Chumpy.app/AppIconInverted60x60@2x.png || { echo "no loose alternate @2x"; exit 1; }
          test -f Payload/Chumpy.app/AppIconInverted76x76@2x~ipad.png || { echo "no loose alternate ipad"; exit 1; }
          # The zip carries no directory entries on purpose: TrollStore's
          # install-sheet parser walks every entry under the app bundle
          # whose name starts with the icon name ("AppIcon") and slices
          # that prefix off the file name — a directory entry like
          # "AppIcon.icon/Assets/" leaves a name shorter than the prefix
          # and the slice dies with NSRangeException, crashing TrollStore
          # before the install sheet ever shows. Extraction needs no
          # directory entries: the unarchiver makes the parents itself.
          zip -qryD Chumpy-unsigned.ipa Payload
          unzip -l Chumpy-unsigned.ipa | head -5

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            device-build.log

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Chumpy-unsigned-ipa
          path: Chumpy-unsigned.ipa
          retention-days: 30
